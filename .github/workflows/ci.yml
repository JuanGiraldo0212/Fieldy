name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:classifier
      - run: pnpm build
        env:
          # Public values only. The build touches no database.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  e2e:
    name: Playwright flows
    runs-on: ubuntu-latest
    # The flows need a database and, for two of three, a session. Both come
    # from repository secrets; without them the work is skipped, not red.
    #
    # The gate is a step rather than a job-level `if`. A job `if` can only read
    # github, needs, vars and inputs — naming `secrets` there is not a false
    # condition, it is an invalid workflow file, and GitHub then fails the
    # whole run in 0s before any job starts. That took the typecheck job down
    # with it, which has nothing to do with e2e. Secrets do reach job `env`,
    # so the presence check happens there and every real step hangs off it.
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_POOL_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_COOKIE: ${{ secrets.E2E_COOKIE }}
      MAIL_DOMAIN: mail.fieldy.ca
    steps:
      - name: Are the e2e secrets set?
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No E2E_DATABASE_URL on this repository. Skipping the flows."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.gate.outputs.ready == 'true'
        with:
          name: playwright-traces
          path: test-results
