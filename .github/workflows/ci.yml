name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:classifier
      - run: pnpm build
        env:
          # Public values only. The build touches no database.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  e2e:
    name: Playwright flows
    runs-on: ubuntu-latest
    # The flows need a database and, for two of three, a session. Both come
    # from repository secrets; without them this job is skipped, not red.
    if: ${{ secrets.E2E_DATABASE_URL != '' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_POOL_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_COOKIE: ${{ secrets.E2E_COOKIE }}
      MAIL_DOMAIN: mail.fieldy.ca
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
